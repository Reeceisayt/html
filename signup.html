<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #081127;
            color: #f4f5ff;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            min-height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, rgba(68, 115, 232, 0.32), transparent 30%),
                        radial-gradient(circle at bottom right, rgba(249, 169, 53, 0.22), transparent 28%),
                        linear-gradient(180deg, #07101f 0%, #0f1a38 100%);
            padding: 24px;
        }
        .form-container {
            width: min(420px, 100%);
            padding: 36px 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(20px);
        }
        .form-heading {
            margin-bottom: 32px;
        }
        .form-heading span {
            display: inline-block;
            margin-bottom: 12px;
            color: #d9c97a;
            font-size: 0.88rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .form-heading h2 {
            margin: 0;
            font-size: clamp(2rem, 2.6vw, 2.4rem);
            letter-spacing: -0.04em;
            line-height: 1.05;
        }
        .form-heading p {
            margin: 14px 0 0;
            color: #d6d8f2;
            line-height: 1.75;
            font-size: 0.98rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #c8cbe8;
            font-size: 0.94rem;
            font-weight: 600;
        }
        input,
        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
            color: #f8f9ff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        input::placeholder {
            color: rgba(244, 245, 255, 0.55);
        }
        input:focus,
        select:focus {
            border-color: rgba(249, 169, 53, 0.95);
            box-shadow: 0 0 0 8px rgba(249, 169, 53, 0.14);
            transform: translateY(-1px);
        }
        select {
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.5) 50%),
                              linear-gradient(135deg, rgba(255,255,255,0.5) 50%, transparent 50%);
            background-position: calc(100% - 22px) 16px, calc(100% - 16px) 16px;
            background-size: 8px 8px, 8px 8px;
            background-repeat: no-repeat;
        }
        button {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #f2c94c 0%, #f2994a 100%);
            color: #081127;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 18px 30px rgba(242, 201, 76, 0.28);
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .form-note {
            margin-top: 20px;
            font-size: 0.88rem;
            color: #b7bbd7;
            text-align: center;
            line-height: 1.6;
        }
        .form-note strong {
            color: #f7f3ff;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-heading">
            <h2>Registration form</h2>
        </div>
        <form action="" novalidate>
            <div class="form-group">
                <label for="fullname">Full name</label>
                <input id="fullname" type="text" name="fullname" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Create password</label>
                <input id="password" type="password" name="password" placeholder="Enter a strong password" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <button type="submit">Register now</button>
            <p class="form-note">By signing up, you agree to our <strong>terms and privacy policy</strong>.</p>
        </form>
    </div>
</body>
</html>
